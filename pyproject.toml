[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netdoctor"
version = "0.1.13"
description = "Adaptive censorship circumvention orchestrator (DPI, DoH, multi-VPN)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx[http2,socks]>=0.27.0",
    "dnspython>=2.6.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "aioquic>=1.0.0",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
netdoctor = "netdoctor.cli:app"

[project.gui-scripts]
netdoctor-gui = "netdoctor.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "src"]
testpaths = ["tests"]
